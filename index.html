<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DOPPLE STUDIO</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-sub: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #243049;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 75px);
      padding-left: 12px;
      padding-right: 12px;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container { width: 100%; max-width: 520px; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-header {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .badge {
      font-size: 0.65rem;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid var(--accent);
      color: #c7d2fe;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .tab-content { display: none; animation: fadeIn 0.15s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0.7; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #c7d2fe;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea, input, select {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }

    .part-card, .char-card {
      background: var(--card-sub);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .part-title {
      font-weight: 800;
      font-size: 0.88rem;
      color: #818cf8;
      margin-bottom: 6px;
    }
    .char-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .char-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    button.btn-main {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    button.btn-main:active { opacity: 0.85; }
    button:disabled {
      background: #334155 !important;
      color: #64748b !important;
      cursor: not-allowed;
      box-shadow: none !important;
    }

    .btn-action {
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .part-tabs-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .part-tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .part-tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .block-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .block-title {
      font-weight: 800;
      font-size: 0.9rem;
      color: #a5b4fc;
    }
    .block-text {
      background: #090e17;
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      line-height: 1.75;
      min-height: 260px;
      max-height: 52vh;
      overflow-y: auto;
      outline: none;
      white-space: pre-wrap;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-copy { background: #334155; color: #cbd5e1; }
    .btn-retry { background: #334155; color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .action-group {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-next { background: linear-gradient(135deg, #d97706, #f59e0b); color: white; padding: 12px; }
    .btn-finish { background: linear-gradient(135deg, #7c3aed, #8b5cf6); color: white; padding: 12px; }
    .btn-reset { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; padding: 12px; margin-top: 8px; }
    .btn-all-copy { background: #1e1b4b; border: 1px solid var(--accent); color: #c7d2fe; padding: 10px; margin-top: 6px; }

    #loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      font-size: 0.82rem;
      color: #fbbf24;
      font-weight: 700;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 15px));
      background: #111827;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      z-index: 1000;
      max-width: 520px;
      margin: 0 auto;
      padding-top: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      gap: 2px;
    }
    .nav-item span.icon { font-size: 1.15rem; }
    .nav-item.active { color: #818cf8; }
    .nav-item.active span.icon { transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="app-header">
      <div class="app-title">⚡ DOPPLE STUDIO</div>
      <div class="header-actions">
        <button class="btn-header" onclick="promptApiKey()">🔑 API</button>
        <div class="badge" id="currentTabName">✍️ 執筆</div>
      </div>
    </div>

    <!-- 1. 👥 登場人物タブ -->
    <div id="tab-characters" class="tab-content">
      <button class="btn-action" style="background:#312e81; color:#c7d2fe; width:100%; margin-bottom:12px; font-weight:800; padding:12px; border-radius:12px;" onclick="addNewCharacter()">➕ キャラクターを追加</button>
      <div id="charactersListArea"></div>
    </div>

    <!-- 2. 🌍 基本設定タブ -->
    <div id="tab-world" class="tab-content">
      <div class="card">
        <div class="card-title">🌍 世界観・能力ルール</div>
        <textarea id="worldInput" style="height: 420px;"></textarea>
      </div>
    </div>

    <!-- 3. 🗺️ 構成タブ（第1部〜第5部） -->
    <div id="tab-story" class="tab-content">
      <div class="card" style="font-size:0.82rem; color:var(--text-muted); margin-bottom:12px;">
        💡 第1部〜第5部の大まかなストーリー展開です。ここを書き換えるとAIが自動で反映します。
      </div>
      <div id="partsListArea"></div>
    </div>

    <!-- 4. 💬 編集者相談タブ -->
    <div id="tab-consult" class="tab-content">
      <div class="card">
        <div class="card-title">💬 専属編集者ブレスト</div>
        <textarea id="consultQuery" style="height: 90px;" placeholder="例：第2部の鉄蔵との戦いで、零が初めてクロと心を通わせるアツいセリフのアイデアある？"></textarea>
        <button class="btn-main" id="consultBtn" onclick="askConsultation()">💡 アイデア・助言をもらう</button>
        <div id="consultResultArea" style="display:none; margin-top:10px; background:#090e17; padding:10px; border-radius:10px; font-size:0.82rem; white-space:pre-wrap; max-height:250px; overflow-y:auto; border:1px solid var(--border);"></div>
      </div>
    </div>

    <!-- 5. ✍️ 執筆スタジオタブ -->
    <div id="tab-write" class="tab-content active">
      <div class="card">
        <div class="card-title">
          <span>📖 執筆ストーリー選択</span>
        </div>
        
        <select id="partSelect" onchange="onPartSelectChange()">
        </select>

        <div style="margin-top:8px; font-size:0.75rem; color:var(--text-muted);">
          【この部の大まかな展開メモ】
        </div>
        <div id="selectedPartSummary" style="background:#090e17; border:1px solid var(--border); border-radius:10px; padding:8px; font-size:0.8rem; line-height:1.5; margin-top:4px; max-height:80px; overflow-y:auto; color:#cbd5e1;"></div>

        <button class="btn-main" id="startBtn" onclick="startGeneration()">⚡ パート1から新規に執筆する</button>
        <div id="loading">⚡ AIが構成を読み取り執筆中...（2,000〜2,800字）</div>
      </div>

      <!-- パート切り替えタブバー -->
      <div class="part-tabs-container" id="partTabsBar" style="display: none;"></div>

      <!-- 単一アクティブパート表示カード -->
      <div id="activeBlockCard" class="block-card" style="display: none;">
        <div class="block-header">
          <div class="block-title" id="activeBlockTitle">パート 1</div>
        </div>
        <div class="block-text" id="activeBlockText" contenteditable="true" oninput="onActiveBlockInput()"></div>
        <div class="btn-grid">
          <button class="btn-action btn-copy" onclick="copyCurrentBlock()">📋 このパートをコピー</button>
          <button class="btn-action btn-retry" id="retryBtn" onclick="retryActiveBlock()">🔄 このパートをリトライ</button>
        </div>
        <button class="btn-action btn-all-copy" id="allCopyBtn" onclick="copyAllBlocks()">📑 全文を一括コピー</button>
      </div>

      <div class="action-group" id="actionArea" style="display: none;">
        <button class="btn-action btn-next" id="nextBtn" onclick="generateNext(false)">⚡ 最新パートから続きを執筆する</button>
        <button class="btn-action btn-finish" id="finishBtn" onclick="generateNext(true)">🏁 この部のクライマックスを描いて完結</button>
      </div>

      <div id="nextStoryArea" style="display: none;">
        <button class="btn-action btn-reset" onclick="goToNextPart()">➡️ 完結！次の部へ進む</button>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('write', '✍️ 執筆')">
      <span class="icon">✍️</span>
      <span>執筆</span>
    </div>
    <div class="nav-item" onclick="switchTab('story', '🗺️ 構成')">
      <span class="icon">🗺️</span>
      <span>構成</span>
    </div>
    <div class="nav-item" onclick="switchTab('characters', '👥 キャラ')">
      <span class="icon">👥</span>
      <span>キャラ</span>
    </div>
    <div class="nav-item" onclick="switchTab('world', '🌍 設定')">
      <span class="icon">🌍</span>
      <span>設定</span>
    </div>
    <div class="nav-item" onclick="switchTab('consult', '💬 相談')">
      <span class="icon">💬</span>
      <span>相談</span>
    </div>
  </div>

  <script>
    function getApiKey() {
      let key = localStorage.getItem('d_gemini_api_key');
      if (!key) {
        key = prompt("Gemini APIキーを入力してください：");
        if (key && key.trim() !== "") {
          localStorage.setItem('d_gemini_api_key', key.trim());
        }
      }
      return key ? key.trim() : "";
    }

    function promptApiKey() {
      const current = localStorage.getItem('d_gemini_api_key') || "";
      const input = prompt("Gemini APIキーを入力・更新してください：", current);
      if (input !== null && input.trim() !== "") {
        localStorage.setItem('d_gemini_api_key', input.trim());
        alert("APIキーを保存しました！");
      }
    }

    let currentPartNum = 1;
    let blockCount = 0;
    let currentPartIndex = 1;
    let blockDataMap = {};

    const INITIAL_PARTS = [
      {
        partNum: 1,
        title: "第1部：都会進学と覚醒・白石との出会い",
        story: `・18歳になった零が都会（関西）の大学へ進学。
・大学の入学式帰りに白石から「ドッペル飼ってるだろ」と声をかけられる。零はドッペルのことを何も知らず「なんですかそれ？」と返す。
・白石が「君が零君か！母親から、自分に何かあったら君を守ってくれと頼まれてる」と告げる。詳しい話は明日聞くことに。
・帰り道に野良ドッペルに急襲される。クロに入れ替えて応戦するが怪我が酷くて動けないピンチに、白石が現れて雷撃で救出する。
・白石の指導のもと、光の回復と影の攻撃の連携特訓を始める。
・夜叉の面のメンバーが遠くから「やっと見つけた」と零を監視し始める。`
      },
      {
        partNum: 2,
        title: "第2部：夜叉の面（関西支部）との激闘",
        story: `・特訓を終えた頃から、夜叉の面の関西支部メンバーが零と白石を次々と襲撃してくる。
・水と氷を操る目隠しの狂人・月影凍刃、怪力で何でも粉砕する無邪気な子供・岩倉砕、ボスに狂信的な愛を捧げる風見嵐華の風攻撃。
・零は光のバリアと回復で耐え、クロが影の刃で切り返しながら四天王を退けていく。
・関西支部ボス・重夜叉鉄蔵が立ちはだかる。重力圧殺に追い詰められ最大の危機に。
・鉄蔵は冷酷だが部下思いの漢。「お前たちは俺の仲間だ、俺が守る」と部下を庇う。
・そこへD.O.Cの部隊が突入して関西支部は壊滅する。`
      },
      {
        partNum: 3,
        title: "第3部：D.O.C合流と母ミキの真実・関東死闘",
        story: `・白石が零に、自分もD.O.C（ドッペル対策局）の潜入メンバーであることを明かす。
・零の安全を守るため、東京のD.O.C総本部へ誘い、零はD.O.Cと共に行動を開始する。
・夜叉の面関東支部との死闘。黒崎教授の撒いた薬で野良ドッペルが暴走する首都防衛戦。
・母ミキの過去の研究データを発見。ミキが未完成薬投与を生き延びたのは妊娠していた零の耐性のおかげだったこと、零を守るため田舎に隠れ住んでいた真相を知る。
・関東支部を撃破し壊滅させる。`
      },
      {
        partNum: 4,
        title: "第4部：世界支部の襲撃と黒崎教授の降臨",
        story: `・関東支部が壊滅したことで、夜叉の面の世界各地の支部から精鋭が日本に集結する。
・ついに黒幕・黒崎教授が直接姿を現す。
・教授から「君の母は私の研究を裏切ったから殺した」と直接告げられ、母を殺した真犯人が教授だと知る。
・零の絶望とクロの殺意が極限に達し、感情が制御不能になる。`
      },
      {
        partNum: 5,
        title: "第5部：零とクロの暴走合体・ゼロの覚醒と魔法DOPPLE",
        story: `・怒りと悲しみで零とクロが暴走し、半分が零（光）、半分がクロ（闇）の異形の姿に合体する。
・誰も止められず、周囲全てが消滅するほどの力を放とうとする寸前、肉体の奥底から「やれやれ、ギリギリ間に合ったか」と三人目の人格【ゼロ】が現れる。
・ゼロが真実を語る：本当の主人公は自分であり、IQが異常に高く創造魔法が使えること。クロに肉体を与えて独立した人間にするための究極魔法「DOPPLE」を完成させるため、零とクロに力を蓄積させていたこと。
・ゼロが魔法【DOPPLE】を発動。世界中の全ドッペルに独立した人間の肉体が創造され、凶暴性と能力が消え去って戦いが終結する。
・能力を失って暴れる教授を、ゼロが別空間に捕獲・封印する。
・危険な能力を持つゼロは自分を封印しようとするが、肉体を得たクロと零に止められ、三人で共に生きていく道を選ぶ。完結。`
      }
    ];

    const INITIAL_CHARACTERS = [
      { name: "影山 零（かげやま れい）", role: "主人公（表人格）", attr: "光（回復・味方強化・光のバリア）", detail: "金髪、眼鏡、琥珀色の瞳。内気で優しい18歳。クロを隠して普通に生きようとする。" },
      { name: "クロ", role: "影のドッペル人格", attr: "闇（影武器・影移動・非治癒傷）", detail: "零の影。好戦的で獰猛。零を守るため戦うが入れ替わりは零の許可が必要。" },
      { name: "白石 翔（しらいし しょう）", role: "大学講師 / D.O.C潜入", attr: "雷（雷撃・電撃）", detail: "普段は軽薄だが白髪モードで覚醒するプロ。母ミキから零の守護を託されている。" },
      { name: "重夜叉 鉄蔵（てつぞう）", role: "夜叉の面 関西ボス", attr: "重力（圧殺・浮遊）", detail: "冷酷だが四天王を家族として守る漢。「仲間は俺が守る」が信念。ミキの過去を知る。" },
      { name: "月影 凍刃（とうじん）", role: "四天王", attr: "水・氷（鋭利な斬撃）", detail: "目隠しの変態剣士。相手の血を凍らせるのが生きがい。" },
      { name: "九条 焔（ほむら）", role: "四天王", attr: "火（爆発・業火）", detail: "高笑いするサイコパス熱血系。燃やすのが生きがい。" },
      { name: "岩倉 砕（さい）", role: "四天王", attr: "土（岩ハンマー・怪力粉砕）", detail: "見た目子供だが相手を粉砕するのが大好きな怪力サイコパス。" },
      { name: "風見 嵐華（らんか）", role: "四天王", attr: "風（嵐・竜巻）", detail: "ボス以外の人間を虫けらと見下す極度のヤンデレ美女。" },
      { name: "黒崎 教授", role: "黒幕 / 夜叉の面総帥", attr: "未完成薬・ウイルス支配", detail: "ミキを殺害し世界にウイルスを撒いたマッドサイエンティスト。" },
      { name: "ゼロ", role: "真の主人公（三人目）", attr: "創造魔法", detail: "零の深層に眠る神童。クロを独立した人間にする魔法DOPPLEのため裏で動いていた。" }
    ];

    const DEFAULT_WORLD = `【基本設定】
・同肉体に表人格とドッペル人格が存在する。
・能力はドッペル人格にしか使えない（主人格は身体能力が少し上がる程度）。
・能力者同士は直感的に相手のドッペルが分かる。
・ドッペルの心臓を止めると倒したドッペルの能力数値が少し上がり、倒されたドッペルは消滅して主人格はドッペルの記憶を失う。
・ドッペルはウイルスにより脳の制御が解除されて生まれた存在。
・ドッペルは強い破壊衝動を持つが、主人格の許可がないと入れ替われない。
・D.O.C（Doppel Operation Command）：ドッペル対策局。夜叉の面や野良ドッペルを取り締まる戦闘班。`;

    let partsList = [];
    let charactersList = [];

    window.onload = function() {
      const savedParts = localStorage.getItem('d_parts_json');
      partsList = savedParts ? JSON.parse(savedParts) : INITIAL_PARTS;
      renderParts();
      setupPartDropdown();

      const savedChars = localStorage.getItem('d_chars_json');
      charactersList = savedChars ? JSON.parse(savedChars) : INITIAL_CHARACTERS;
      renderCharacters();

      document.getElementById('worldInput').value = localStorage.getItem('d_world') || DEFAULT_WORLD;
      document.getElementById('worldInput').addEventListener('input', e => localStorage.setItem('d_world', e.target.value));

      loadPartWritingState(currentPartNum);
    };

    function renderParts() {
      const area = document.getElementById('partsListArea');
      area.innerHTML = '';
      partsList.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'part-card';
        div.innerHTML = `
          <div class="part-title">${p.title}</div>
          <textarea style="height:140px;" onchange="updatePartStory(${idx}, this.value)">${escapeHtml(p.story)}</textarea>
        `;
        area.appendChild(div);
      });
    }

    function updatePartStory(idx, val) {
      partsList[idx].story = val;
      localStorage.setItem('d_parts_json', JSON.stringify(partsList));
      onPartSelectChange();
    }

    function setupPartDropdown() {
      const select = document.getElementById('partSelect');
      const savedPartNum = localStorage.getItem('d_current_part_num') || "1";
      currentPartNum = parseInt(savedPartNum, 10);

      select.innerHTML = '';
      partsList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.partNum;
        opt.innerText = p.title;
        select.appendChild(opt);
      });
      select.value = currentPartNum;
      updatePartSummary();
    }

    function onPartSelectChange() {
      savePartWritingState(currentPartNum);

      currentPartNum = parseInt(document.getElementById('partSelect').value, 10);
      localStorage.setItem('d_current_part_num', currentPartNum);

      updatePartSummary();
      loadPartWritingState(currentPartNum);
    }

    function updatePartSummary() {
      const pData = partsList.find(p => p.partNum === currentPartNum);
      if (pData) {
        document.getElementById('selectedPartSummary').innerText = pData.story;
      }
    }

    function savePartWritingState(pNum) {
      const state = {
        count: blockCount,
        activeIdx: currentPartIndex,
        dataMap: blockDataMap,
        hasAction: document.getElementById('actionArea').style.display !== 'none',
        hasNextStory: document.getElementById('nextStoryArea').style.display !== 'none'
      };
      localStorage.setItem(`d_saved_part_${pNum}`, JSON.stringify(state));
    }

    function loadPartWritingState(pNum) {
      const saved = localStorage.getItem(`d_saved_part_${pNum}`);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          blockCount = state.count || 0;
          blockDataMap = state.dataMap || {};
          currentPartIndex = state.activeIdx || blockCount || 1;

          if (blockCount > 0) {
            renderPartTabs();
            showActiveBlock(currentPartIndex);
            document.getElementById('actionArea').style.display = state.hasAction ? 'flex' : 'none';
            document.getElementById('nextStoryArea').style.display = state.hasNextStory ? 'block' : 'none';
            return;
          }
        } catch (e) {}
      }

      blockCount = 0;
      currentPartIndex = 1;
      blockDataMap = {};
      renderPartTabs();
      document.getElementById('activeBlockCard').style.display = 'none';
      document.getElementById('actionArea').style.display = 'none';
      document.getElementById('nextStoryArea').style.display = 'none';
    }

    function renderCharacters() {
      const area = document.getElementById('charactersListArea');
      area.innerHTML = '';
      charactersList.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'char-card';
        div.innerHTML = `
          <div class="char-header">
            <span style="font-weight:800; font-size:0.85rem; color:#818cf8;">#${idx + 1}</span>
            <button style="background:none; border:none; color:#f87171; cursor:pointer;" onclick="deleteCharacter(${idx})">🗑️ 削除</button>
          </div>
          <div class="char-row">
            <div>
              <div class="field-label">名前</div>
              <input type="text" value="${escapeHtml(c.name)}" onchange="updateCharField(${idx}, 'name', this.value)">
            </div>
            <div>
              <div class="field-label">役割 / 所属</div>
              <input type="text" value="${escapeHtml(c.role)}" onchange="updateCharField(${idx}, 'role', this.value)">
            </div>
          </div>
          <div style="margin-bottom:8px;">
            <div class="field-label">属性・能力</div>
            <input type="text" value="${escapeHtml(c.attr)}" onchange="updateCharField(${idx}, 'attr', this.value)">
          </div>
          <div>
            <div class="field-label">詳細・性格・見た目</div>
            <textarea style="height:60px;" onchange="updateCharField(${idx}, 'detail', this.value)">${escapeHtml(c.detail)}</textarea>
          </div>
        `;
        area.appendChild(div);
      });
    }

    function updateCharField(idx, field, val) {
      charactersList[idx][field] = val;
      localStorage.setItem('d_chars_json', JSON.stringify(charactersList));
    }

    function addNewCharacter() {
      charactersList.unshift({ name: "新しいキャラクター", role: "味方 / 敵", attr: "属性", detail: "設定を入力してください。" });
      localStorage.setItem('d_chars_json', JSON.stringify(charactersList));
      renderCharacters();
    }

    function deleteCharacter(idx) {
      if (confirm(`「${charactersList[idx].name}」を削除しますか？`)) {
        charactersList.splice(idx, 1);
        localStorage.setItem('d_chars_json', JSON.stringify(charactersList));
        renderCharacters();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getAllContext() {
      let charsText = "【登場人物名鑑】\n";
      charactersList.forEach(c => {
        charsText += `・${c.name}（${c.role}）: 属性【${c.attr}】 詳細: ${c.detail}\n`;
      });
      const world = document.getElementById('worldInput').value;
      return `${charsText}\n\n【世界観・能力ルール】\n${world}`;
    }

    function switchTab(tabId, tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('currentTabName').innerText = tabName;
      const navMap = { write: 0, story: 1, characters: 2, world: 3, consult: 4 };
      document.querySelectorAll('.nav-item')[navMap[tabId]].classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function limitTo3000Chars(str) {
      if (!str) return "";
      if (str.length <= 2800) return str;
      let cutIndex = str.lastIndexOf("。", 2800);
      if (cutIndex === -1 || cutIndex < 2000) cutIndex = 2800;
      return str.substring(0, cutIndex + 1);
    }

    function cleanGeminiOutput(text) {
      if (!text) return "";
      return text.replace(/\\n/g, "\n")
                 .replace(/\\"/g, '"')
                 .replace(/",\s*"type"\s*:\s*"text"[\s\S]*/, "")
                 .replace(/"type"\s*:\s*"text"[\s\S]*/, "")
                 .replace(/\{\s*"totalTokenCount"[\s\S]*/, "")
                 .replace(/\{\s*"usageMetadata"[\s\S]*/, "")
                 .replace(/```markdown/gi, "")
                 .replace(/```/g, "")
                 .trim();
    }

    async function callGemini(promptText) {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("APIキーが設定されていません。画面右上の「🔑 API」から入力してください。");

      const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${apiKey}`;
      const payload = {
        model: "gemini-3.5-flash",
        input: promptText,
        generation_config: { max_output_tokens: 8192 }
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const rawText = await res.text();
      const json = JSON.parse(rawText);
      if (json.error) throw new Error("APIエラー: " + json.error.message);

      let text = "";
      try {
        if (json.steps && json.steps.length > 0) {
          for (let step of json.steps) {
            if (step.content && step.content.parts) {
              for (let part of step.content.parts) if (part.text) text += part.text;
            } else if (step.output) {
              if (typeof step.output === 'string') text += step.output;
              else if (step.output.content && step.output.content.parts) {
                for (let part of step.output.content.parts) if (part.text) text += part.text;
              }
            }
          }
        }
      } catch (e) {}

      if (!text && json.outputs && json.outputs.length > 0) text = json.outputs[0].text || "";
      if (!text) {
        const match = rawText.match(/"text"\s*:\s*"([\s\S]*?)"\s*\}(?=\s*,\s*"type"|\s*\]|\s*$)/);
        text = match ? match[1] : "";
      }
      if (!text) throw new Error("本文を取得できませんでした。");

      return cleanGeminiOutput(text);
    }

    function setLoading(isLoading, text) {
      document.getElementById('startBtn').disabled = isLoading;
      const consultBtn = document.getElementById('consultBtn');
      if (consultBtn) consultBtn.disabled = isLoading;
      const nextBtn = document.getElementById('nextBtn');
      const finishBtn = document.getElementById('finishBtn');
      if (nextBtn) nextBtn.disabled = isLoading;
      if (finishBtn) finishBtn.disabled = isLoading;
      
      const loadEl = document.getElementById('loading');
      if (text) loadEl.innerText = text;
      loadEl.style.display = isLoading ? 'block' : 'none';
    }

    async function askConsultation() {
      const query = document.getElementById('consultQuery').value;
      if (!query.trim()) {
        alert('相談内容を入力してください。');
        return;
      }
      setLoading(true, "💡 編集者が助言を考案中...");
      
      const currentPart = partsList.find(p => p.partNum === currentPartNum);

      const prompt = `あなたはWeb小説『DOPPLE』の専属敏腕編集者です。
作者からの相談に答えてください。

【作品設定】
${getAllContext()}

【現在進行中の部：${currentPart.title}】
大まかな展開：
${currentPart.story}

【作者からの相談】
${query}

【回答指示】
1. 編集者としてのアドバイス
2. 【具体的な展開案】（バトルの演出やセリフのアイデア）`;

      try {
        const text = await callGemini(prompt);
        setLoading(false);
        const area = document.getElementById('consultResultArea');
        area.style.display = 'block';
        area.innerText = text;
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    function renderPartTabs() {
      const bar = document.getElementById('partTabsBar');
      if (blockCount <= 0) {
        bar.style.display = 'none';
        document.getElementById('activeBlockCard').style.display = 'none';
        return;
      }

      bar.innerHTML = '';
      bar.style.display = 'flex';
      for (let i = 1; i <= blockCount; i++) {
        const btn = document.createElement('button');
        btn.className = `part-tab-btn ${i === currentPartIndex ? 'active' : ''}`;
        btn.innerText = `パート ${i}`;
        btn.onclick = () => showActiveBlock(i);
        bar.appendChild(btn);
      }
    }

    function showActiveBlock(idx) {
      currentPartIndex = idx;
      renderPartTabs();

      const card = document.getElementById('activeBlockCard');
      card.style.display = 'block';

      const text = blockDataMap[idx] || "";
      document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${idx} （${text.length}文字）`;
      document.getElementById('activeBlockText').innerText = text;
      document.getElementById('allCopyBtn').innerText = `📑 第${currentPartNum}部の全パートを一括コピー`;

      if (currentPartIndex < blockCount) {
        document.getElementById('nextBtn').innerText = `⚡ パート ${currentPartIndex} の続きとして再分岐する`;
      } else {
        document.getElementById('nextBtn').innerText = `⚡ パート ${blockCount + 1} を執筆する`;
      }

      savePartWritingState(currentPartNum);
    }

    function onActiveBlockInput() {
      const text = document.getElementById('activeBlockText').innerText;
      blockDataMap[currentPartIndex] = text;
      document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${currentPartIndex} （${text.length}文字）`;
      savePartWritingState(currentPartNum);
    }

    function copyCurrentBlock() {
      const text = blockDataMap[currentPartIndex] || "";
      navigator.clipboard.writeText(text).then(() => {
        alert(`第${currentPartNum}部 パート ${currentPartIndex} をコピーしました！`);
      });
    }

    function copyAllBlocks() {
      let allText = "";
      for (let i = 1; i <= blockCount; i++) {
        allText += `【第${currentPartNum}部 パート ${i}】\n\n${blockDataMap[i] || ""}\n\n`;
      }
      navigator.clipboard.writeText(allText.trim()).then(() => {
        alert(`第${currentPartNum}部 全${blockCount}パート（計 ${allText.length} 文字）を一括コピーしました！\nスプレッドシート等にそのまま貼り付けられます。`);
      });
    }

    async function startGeneration() {
      const part = partsList.find(p => p.partNum === currentPartNum);

      if (blockCount > 0 && !confirm(`第${currentPartNum}部のパート1を新設定で書き直します。\n※パート2以降の古い文章はリセットされ、新パート1に合わせた新しい続きが書けるようになります。よろしいですか？`)) {
        return;
      }

      blockCount = 0;
      currentPartIndex = 1;
      blockDataMap = {};
      renderPartTabs();
      document.getElementById('actionArea').style.display = 'none';
      document.getElementById('nextStoryArea').style.display = 'none';
      savePartWritingState(currentPartNum);

      setLoading(true, `✍️ 【${part.title}】新パート1を執筆中...`);

      const prompt = `あなたはプロのライトノベル作家です。
最新の作品設定と、作者が構想した【この部の大まかな展開】をしっかりと読み取って、『DOPPLE』の第${currentPartNum}部 パート1を執筆してください。

【作品設定（最新）】
${getAllContext()}

【ストーリー展開：${part.title}】
${part.story}

【執筆ルール（最重要）】
・この展開の「冒頭・導入シーン」から執筆を開始してください。
・設定解説の朗読は厳禁。キャラクターの仕草、息遣い、会話のテンポ、緊迫感で見せること（Show, don't tell）。
・影山零の内気さとクロの凶暴さのコントラストを際立たせること。
・文章量は【2,000〜2,800文字程度】で執筆してください。
・解説や前置きは書かず、小説本文のみを出力してください。`;

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        setLoading(false);

        blockCount = 1;
        currentPartIndex = 1;
        blockDataMap[1] = limited;

        renderPartTabs();
        showActiveBlock(1);
        document.getElementById('actionArea').style.display = 'flex';
        savePartWritingState(currentPartNum);
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    async function generateNext(isFinal) {
      const part = partsList.find(p => p.partNum === currentPartNum);

      if (currentPartIndex < blockCount) {
        if (!confirm(`現在「パート ${currentPartIndex}」を表示中です。\nこのパートの直後から新しい展開として書き直しますか？\n（パート ${currentPartIndex + 1} 以降の古い文章は上書きされます）`)) {
          return;
        }
        for (let i = currentPartIndex + 1; i <= blockCount; i++) {
          delete blockDataMap[i];
        }
        blockCount = currentPartIndex;
      }

      const lastText = blockDataMap[blockCount] || "";
      const safeLastText = lastText.length > 1500 ? lastText.substring(lastText.length - 1500) : lastText;
      const targetPartIndex = blockCount + 1;

      setLoading(true, isFinal ? `🏁 【${part.title}】完結パートを執筆中...` : `✍️ パート ${targetPartIndex} を執筆中...`);

      let endingInstruction = "直前の文章から直接つなげて、この部のストーリー展開の次のシーンへと物語を進めてください。前後の辻褄を完璧に合わせてください。";
      if (isFinal) {
        endingInstruction = `直前の文章からつなげて、この部の大まかな展開の決着・クライマックスを描ききり、綺麗に完結させてください。`;
      }

      const prompt = `あなたはプロのライトノベル作家です。『DOPPLE』第${currentPartNum}部の続き（パート ${targetPartIndex}）を執筆してください。

【作品設定（最新）】
${getAllContext()}

【ストーリー展開：${part.title}】
${part.story}

【直前の本文（この直後から繋げてください）】
${safeLastText}

【執筆指示】
・${endingInstruction}
・設定説明に終始せず、キャラクターの生々しい行動と会話を主体に描写すること。
・直前の出来事やセリフの流れから違和感なく続きを展開すること。
・文章量は【2,000〜2,800文字程度】で執筆してください。
・小説本文のみを出力してください。`;

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        setLoading(false);

        blockCount++;
        currentPartIndex = blockCount;
        blockDataMap[blockCount] = limited;

        renderPartTabs();
        showActiveBlock(blockCount);

        if (isFinal) {
          document.getElementById('actionArea').style.display = 'none';
          document.getElementById('nextStoryArea').style.display = 'block';
        }
        savePartWritingState(currentPartNum);
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    async function retryActiveBlock() {
      const part = partsList.find(p => p.partNum === currentPartNum);
      
      let prevText = "";
      if (currentPartIndex > 1) {
        prevText = blockDataMap[currentPartIndex - 1] || "";
      }
      const safeLastText = prevText.length > 1500 ? prevText.substring(prevText.length - 1500) : prevText;

      document.getElementById('retryBtn').disabled = true;
      document.getElementById('activeBlockText').innerText = "🔄 AIが再執筆中...";

      let prompt = "";
      if (currentPartIndex === 1) {
        prompt = `あなたはプロのライトノベル作家です。『DOPPLE』【${part.title}】パート1を最新設定に基づいて書き直してください。\n\n【最新設定】\n${getAllContext()}\n\n【展開】\n${part.story}\n\n冒頭シーンから2,000〜2,800文字で執筆してください。`;
      } else {
        prompt = `あなたはプロのライトノベル作家です。『DOPPLE』【${part.title}】パート ${currentPartIndex} を書き直してください。\n\n【最新設定】\n${getAllContext()}\n\n【展開】\n${part.story}\n\n【直前本文】\n${safeLastText}\n\n直前の文章から直接繋げて2,000〜2,800文字で執筆してください。`;
      }

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        blockDataMap[currentPartIndex] = limited;
        document.getElementById('activeBlockText').innerText = limited;
        document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${currentPartIndex} （${limited.length}文字）`;
        document.getElementById('retryBtn').disabled = false;
        savePartWritingState(currentPartNum);
      } catch (err) {
        document.getElementById('retryBtn').disabled = false;
        alert(err.message);
      }
    }

    function goToNextPart() {
      savePartWritingState(currentPartNum);

      const nextNum = currentPartNum + 1;
      if (nextNum <= partsList.length) {
        document.getElementById('partSelect').value = nextNum;
        onPartSelectChange();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        alert(`第${currentPartNum}部の本文を保存し、第${nextNum}部の準備が完了しました！`);
      } else {
        alert('全5部が完結しました！お疲れ様でした！');
      }
    }
  </script>
</body>
