<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>豚面執事 STUDIO</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f1410;
      --card-bg: #18221b;
      --card-sub: #223026;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2d4234;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 75px);
      padding-left: 12px;
      padding-right: 12px;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container { width: 100%; max-width: 520px; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: linear-gradient(135deg, #132a1c, #1f472e);
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-header {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .badge {
      font-size: 0.65rem;
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid var(--accent);
      color: #a7f3d0;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .tab-content { display: none; animation: fadeIn 0.15s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0.7; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #a7f3d0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea, input, select {
      width: 100%;
      background: #0a0f0c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }

    .part-card, .char-card {
      background: var(--card-sub);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .part-header, .char-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .char-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    button.btn-main {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    button.btn-main:active { opacity: 0.85; }
    button:disabled {
      background: #334155 !important;
      color: #64748b !important;
      cursor: not-allowed;
      box-shadow: none !important;
    }

    .btn-action {
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .part-tabs-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .part-tab-btn {
      background: #18221b;
      color: #94a3b8;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .part-tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .block-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .block-title {
      font-weight: 800;
      font-size: 0.9rem;
      color: #a7f3d0;
    }
    .block-text {
      background: #0a0f0c;
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      line-height: 1.75;
      min-height: 260px;
      max-height: 52vh;
      overflow-y: auto;
      outline: none;
      white-space: pre-wrap;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-copy { background: #334155; color: #cbd5e1; }
    .btn-retry { background: #334155; color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .action-group {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-next { background: linear-gradient(135deg, #d97706, #f59e0b); color: white; padding: 12px; }
    .btn-finish { background: linear-gradient(135deg, #059669, #10b981); color: white; padding: 12px; }
    .btn-reset { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; padding: 12px; margin-top: 8px; }
    .btn-all-copy { background: #132a1c; border: 1px solid var(--accent); color: #a7f3d0; padding: 10px; margin-top: 6px; }

    #loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      font-size: 0.82rem;
      color: #fbbf24;
      font-weight: 700;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 15px));
      background: #0a0f0c;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      z-index: 1000;
      max-width: 520px;
      margin: 0 auto;
      padding-top: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      gap: 2px;
    }
    .nav-item span.icon { font-size: 1.15rem; }
    .nav-item.active { color: #34d399; }
    .nav-item.active span.icon { transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="app-header">
      <div class="app-title">🐷 豚面執事 STUDIO</div>
      <div class="header-actions">
        <button class="btn-header" onclick="promptApiKey()">🔑 API</button>
        <div class="badge" id="currentTabName">✍️ 執筆</div>
      </div>
    </div>

    <!-- 1. 👥 登場人物タブ -->
    <div id="tab-characters" class="tab-content">
      <button class="btn-action" style="background:#132a1c; color:#a7f3d0; width:100%; margin-bottom:12px; font-weight:800; padding:12px; border-radius:12px; border:1px dashed var(--accent);" onclick="addNewCharacter()">➕ キャラクターを追加</button>
      <div id="charactersListArea"></div>
    </div>

    <!-- 2. 🌍 基本設定タブ -->
    <div id="tab-world" class="tab-content">
      <div class="card">
        <div class="card-title">🌍 世界観・ルール設定</div>
        <textarea id="worldInput" style="height: 420px;"></textarea>
      </div>
    </div>

    <!-- 3. 🗺️ 構成タブ -->
    <div id="tab-story" class="tab-content">
      <div class="card" style="font-size:0.82rem; color:var(--text-muted); margin-bottom:12px; line-height:1.6;">
        💡 ストーリーの各部構成です。何部構成でも自由に増やしたり減らしたりできます。
      </div>
      <button class="btn-action" style="background:#132a1c; color:#a7f3d0; width:100%; margin-bottom:12px; font-weight:800; padding:12px; border-radius:12px; border:1px dashed var(--accent);" onclick="addNewPart()">➕ 新しい部（章）を追加</button>
      <div id="partsListArea"></div>
    </div>

    <!-- 4. 💬 編集者相談タブ -->
    <div id="tab-consult" class="tab-content">
      <div class="card">
        <div class="card-title">💬 専属編集者ブレスト</div>
        <textarea id="consultQuery" style="height: 90px;" placeholder="例：豚の被り物の表情が動いてエリーにツッコまれるコミカルな掛け合いのアイデアある？"></textarea>
        <button class="btn-main" id="consultBtn" onclick="askConsultation()">💡 アイデア・助言をもらう</button>
        <div id="consultResultArea" style="display:none; margin-top:10px; background:#0a0f0c; padding:10px; border-radius:10px; font-size:0.82rem; white-space:pre-wrap; max-height:250px; overflow-y:auto; border:1px solid var(--border);"></div>
      </div>
    </div>

    <!-- 5. ✍️ 執筆スタジオタブ -->
    <div id="tab-write" class="tab-content active">
      <div class="card">
        <div class="card-title">
          <span>📖 執筆ストーリー選択</span>
        </div>
        
        <select id="partSelect" onchange="onPartSelectChange()">
        </select>

        <div style="margin-top:8px; font-size:0.75rem; color:var(--text-muted);">
          【この部の大まかな展開メモ】
        </div>
        <div id="selectedPartSummary" style="background:#0a0f0c; border:1px solid var(--border); border-radius:10px; padding:8px; font-size:0.8rem; line-height:1.5; margin-top:4px; max-height:80px; overflow-y:auto; color:#cbd5e1;"></div>

        <button class="btn-main" id="startBtn" onclick="startGeneration()">⚡ パート1から新規に執筆する</button>
        <div id="loading">⚡ AIが構成を読み取り執筆中...（2,000〜2,800字）</div>
      </div>

      <div class="part-tabs-container" id="partTabsBar" style="display: none;"></div>

      <div id="activeBlockCard" class="block-card" style="display: none;">
        <div class="block-header">
          <div class="block-title" id="activeBlockTitle">パート 1</div>
        </div>
        <div class="block-text" id="activeBlockText" contenteditable="true" oninput="onActiveBlockInput()"></div>
        <div class="btn-grid">
          <button class="btn-action btn-copy" onclick="copyCurrentBlock()">📋 このパートをコピー</button>
          <button class="btn-action btn-retry" id="retryBtn" onclick="retryActiveBlock()">🔄 このパートをリトライ</button>
        </div>
        <button class="btn-action btn-all-copy" id="allCopyBtn" onclick="copyAllBlocks()">📑 全文を一括コピー</button>
      </div>

      <div class="action-group" id="actionArea" style="display: none;">
        <button class="btn-action btn-next" id="nextBtn" onclick="generateNext(false)">⚡ 最新パートから続きを執筆する</button>
        <button class="btn-action btn-finish" id="finishBtn" onclick="generateNext(true)">🏁 この部のクライマックスを描いて完結</button>
      </div>

      <div id="nextStoryArea" style="display: none;">
        <button class="btn-action btn-reset" onclick="goToNextPart()">➡️ 完結！次の部へ進む</button>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('write', '✍️ 執筆')">
      <span class="icon">✍️</span>
      <span>執筆</span>
    </div>
    <div class="nav-item" onclick="switchTab('story', '🗺️ 構成')">
      <span class="icon">🗺️</span>
      <span>構成</span>
    </div>
    <div class="nav-item" onclick="switchTab('characters', '👥 キャラ')">
      <span class="icon">👥</span>
      <span>キャラ</span>
    </div>
    <div class="nav-item" onclick="switchTab('world', '🌍 設定')">
      <span class="icon">🌍</span>
      <span>設定</span>
    </div>
    <div class="nav-item" onclick="switchTab('consult', '💬 相談')">
      <span class="icon">💬</span>
      <span>相談</span>
    </div>
  </div>

  <script>
    function getApiKey() {
      let key = localStorage.getItem('buta_gemini_api_key') || localStorage.getItem('d_gemini_api_key');
      if (!key) {
        key = prompt("Gemini APIキーを入力してください：");
        if (key && key.trim() !== "") {
          localStorage.setItem('buta_gemini_api_key', key.trim());
        }
      }
      return key ? key.trim() : "";
    }

    function promptApiKey() {
      const current = localStorage.getItem('buta_gemini_api_key') || localStorage.getItem('d_gemini_api_key') || "";
      const input = prompt("Gemini APIキーを入力・更新してください：", current);
      if (input !== null && input.trim() !== "") {
        localStorage.setItem('buta_gemini_api_key', input.trim());
        alert("APIキーを保存しました！");
      }
    }

    let currentPartNum = 1;
    let blockCount = 0;
    let currentPartIndex = 1;
    let blockDataMap = {};

    const INITIAL_PARTS = [
      {
        partNum: 1,
        title: "第1部：解雇からの異世界転移・ボロ屋敷の出会い",
        story: `・両親がなく幼少期に老紳士（旦那様）に拾われ完璧な執事となった大場蓮（22歳）。あまりにイケメンすぎて仕事にならず、旦那様特注のピンク豚の被り物を着用している。
・旦那様が他界し、音信不通だった一人息子夫婦が現れ罵倒されて理不尽に解雇される。
・雨の街角で途方に暮れていた時、どこからか「助けて……！」と少女の切迫した声が響く。
・「かしこまりました、お嬢様」と礼をして答えた瞬間、光の魔法陣に包まれ異世界へ転移。
・転移先は埃とクモの巣だらけのボロボロの屋敷。目の前には絶望して泣きそうな金髪美少女エリー（16歳）と怯える弟カイル（8歳）がいた。
・ピンクの豚頭が現れて大パニックになる姉弟に対し、蓮は完璧な一礼を決め、流れるような所作で屋敷の掃除と絶品オムレツの給仕を開始する。`
      },
      {
        partNum: 2,
        title: "第2部：悪徳借金取りの襲撃と豚面執事の制裁",
        story: `・両親を亡くし借金まみれのワイズ子爵家を取り潰そうと、悪徳商人とゴロツキたちが強引な取り立てに押し寄せてくる。
・エリーとおびえるカイルの前に、紅茶のポットを持った蓮（異世界名：レン）が立ちはだかる。
・優雅に紅茶をカップに注ぎながら、襲いかかる屈強なゴロツキたちを片手の超絶格闘術で全員無傷で瞬殺・制圧。
・さらに前世の知識と帳簿精査で違法な金利を暴き、商人たちを笑顔（豚面の目が冷酷に光る）で論破して叩き出す。
・カイルが「ブタさんのお兄ちゃんかっこいい！」と完全に懐く。`
      },
      {
        partNum: 3,
        title: "第3部：王都学園の夜会とピンク豚旋風",
        story: `・子爵家の体面を保つため、エリーが王都の名門学園の社交パーティーに出席することに。
・傲慢な上位貴族たちから「豚の被り物を連れた没落令嬢」と嘲笑・嫌がらせを受けるエリー。
・レンが極上のエスコート、完璧なマナー、プロ顔負けの華麗なダンスステップで会場中の貴族たちを圧倒。
・豚の被り物なのに所作がエレガントすぎるレンに王都の令嬢たちがざわつき、なぜか王都で豚面が謎の流行を見せ始めるコメディ展開。`
      },
      {
        partNum: 4,
        title: "第4部：両親の死の真相と暗殺者部隊",
        story: `・エリーの両親の急死が、子爵家の領地・鉱山利権を狙う悪徳伯爵による毒殺だったことが判明。
・証拠を隠滅するため、伯爵が放った手練れの暗殺者部隊が夜のワイズ邸を完全包囲する。
・エリーとカイルを安全な部屋に隠し、レンが一人で暗殺部隊を迎え撃つ。
・銀のカトラリーと超絶体術を武器に、表情一つ変えず（豚の被り物が怒りの表情に変わりつつ）暗殺部隊を全滅させるレン。`
      },
      {
        partNum: 5,
        title: "第5部：仮面の下の素顔と、新しい家族の絆",
        story: `・国王の面前で悪徳伯爵の罪を白日のもとに晒し、ワイズ子爵家の名誉と領地を完全に回復させる。
・屋敷に戻り平和が訪れたある日、カイルが無邪気に「レンさんの本当のお顔が見たい！」と豚マスクを引っ張り、一瞬だけ超絶美形の素顔が見えかけて大騒動に。
・エリーは赤面しながら「……別に、豚のままでもいいわ。あなたは私たちの、世界一の執事なんだから」。
・被り物が照れたようにほんのりピンクを濃くし、レンは深々と一礼する。「恐悦至極に存じます、お嬢様」。三人で温かい食卓を囲んでハッピーエンド完結。`
      }
    ];

    const INITIAL_CHARACTERS = [
      { 
        name: "大場 蓮（レン）", 
        role: "主人公（完璧豚面執事）", 
        attr: "超絶家事・護衛体術・経営補佐", 
        detail: "22歳、黒髪の日本人。超絶美形すぎて仕事にならないため、亡き前主人から賜った「特注ピンク豚の被り物」を常時着用。被り物なのに怒ったり呆れたり表情が動くが、ツッコまれてもしらを切る。常に落ち着いた丁寧語。" 
      },
      { 
        name: "エリー・ワイズ", 
        role: "ヒロイン（ワイズ子爵家当主）", 
        attr: "子爵令嬢", 
        detail: "16歳、金髪の美少女。両親を亡くして幼い弟カイルとボロ屋敷で健気に生きている。古びた魔導書で助けを求めたらピンクの豚（レン）が召喚されて困惑するが、胃袋と心を掴まれていく。" 
      },
      { 
        name: "カイル・ワイズ", 
        role: "エリーの弟", 
        attr: "8歳・美少年", 
        detail: "金髪の美少年。甘えたがりで寂しがり屋。最初はピンク豚のレンを怖がるが、極上のお菓子と優しさで一瞬で懐き、大ファンになる。" 
      }
    ];

    const DEFAULT_WORLD = `【基本設定】
・中世ヨーロッパ風の魔法と貴族が存在する異世界。
・ワイズ子爵家はかつて名門だったが、両親の急死と悪徳貴族たちの嫌がらせにより借金を抱え、屋敷はボロボロで召使いも全員逃げ出した。
・レンは元の世界で孤児だったが前主人の旦那様に拾われ完璧な執事となった。旦那様の死後、息子夫婦に罵倒されてクビになり、エリーの「助けて」の声に「かしこまりました」と応えて転移した。
・レンは魔法を使えないが、鍛え抜かれた執事の体術・教養・所作が異世界の常識を遥かに凌駕するチートを発揮する。
・ピンクの豚の被り物なのに表情がコミカルに変わり、ツッコまれても「何のことでしょうか？」としらを切る。
・コメディ7割（豚マスクのシュールさ、無自覚な無双）、感動3割（家族を亡くした姉弟とレンの絆）。`;

    let partsList = [];
    let charactersList = [];

    window.onload = function() {
      const savedParts = localStorage.getItem('buta_parts_json');
      partsList = savedParts ? JSON.parse(savedParts) : INITIAL_PARTS;
      renderParts();
      setupPartDropdown();

      const savedChars = localStorage.getItem('buta_chars_json');
      charactersList = savedChars ? JSON.parse(savedChars) : INITIAL_CHARACTERS;
      renderCharacters();

      document.getElementById('worldInput').value = localStorage.getItem('buta_world') || DEFAULT_WORLD;
      document.getElementById('worldInput').addEventListener('input', e => localStorage.setItem('buta_world', e.target.value));

      loadPartWritingState(currentPartNum);
    };

    function renderParts() {
      const area = document.getElementById('partsListArea');
      area.innerHTML = '';
      partsList.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'part-card';
        div.innerHTML = `
          <div class="part-header">
            <input type="text" style="font-weight:800; font-size:0.88rem; color:#34d399; width:75%; padding:4px 8px;" value="${escapeHtml(p.title)}" onchange="updatePartTitle(${idx}, this.value)">
            <button style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.8rem;" onclick="deletePart(${idx})">🗑️ 削除</button>
          </div>
          <div class="field-label">大まかな展開プロット</div>
          <textarea style="height:120px;" onchange="updatePartStory(${idx}, this.value)">${escapeHtml(p.story)}</textarea>
        `;
        area.appendChild(div);
      });
    }

    function updatePartTitle(idx, val) {
      partsList[idx].title = val;
      localStorage.setItem('buta_parts_json', JSON.stringify(partsList));
      setupPartDropdown();
    }

    function updatePartStory(idx, val) {
      partsList[idx].story = val;
      localStorage.setItem('buta_parts_json', JSON.stringify(partsList));
      onPartSelectChange();
    }

    function addNewPart() {
      const newNum = partsList.length + 1;
      partsList.push({
        partNum: newNum,
        title: `第${newNum}部：新しい展開`,
        story: `・第${newNum}部のプロットを入力してください。`
      });
      reindexParts();
      localStorage.setItem('buta_parts_json', JSON.stringify(partsList));
      renderParts();
      setupPartDropdown();
    }

    function deletePart(idx) {
      if (partsList.length <= 1) {
        alert("これ以上部は削除できません（最低1部は必要です）。");
        return;
      }
      if (confirm(`「${partsList[idx].title}」を削除しますか？`)) {
        partsList.splice(idx, 1);
        reindexParts();
        localStorage.setItem('buta_parts_json', JSON.stringify(partsList));
        if (currentPartNum > partsList.length) currentPartNum = partsList.length;
        renderParts();
        setupPartDropdown();
      }
    }

    function reindexParts() {
      partsList.forEach((p, i) => {
        p.partNum = i + 1;
      });
    }

    function setupPartDropdown() {
      const select = document.getElementById('partSelect');
      const savedPartNum = localStorage.getItem('buta_current_part_num') || "1";
      currentPartNum = parseInt(savedPartNum, 10);
      if (currentPartNum > partsList.length) currentPartNum = 1;

      select.innerHTML = '';
      partsList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.partNum;
        opt.innerText = p.title;
        select.appendChild(opt);
      });
      select.value = currentPartNum;
      updatePartSummary();
    }

    function onPartSelectChange() {
      savePartWritingState(currentPartNum);
      currentPartNum = parseInt(document.getElementById('partSelect').value, 10);
      localStorage.setItem('buta_current_part_num', currentPartNum);
      updatePartSummary();
      loadPartWritingState(currentPartNum);
    }

    function updatePartSummary() {
      const pData = partsList.find(p => p.partNum === currentPartNum);
      if (pData) {
        document.getElementById('selectedPartSummary').innerText = pData.story;
      }
    }

    function savePartWritingState(pNum) {
      const state = {
        count: blockCount,
        activeIdx: currentPartIndex,
        dataMap: blockDataMap,
        hasAction: document.getElementById('actionArea').style.display !== 'none',
        hasNextStory: document.getElementById('nextStoryArea').style.display !== 'none'
      };
      localStorage.setItem(`buta_saved_part_${pNum}`, JSON.stringify(state));
    }

    function loadPartWritingState(pNum) {
      const saved = localStorage.getItem(`buta_saved_part_${pNum}`);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          blockCount = state.count || 0;
          blockDataMap = state.dataMap || {};
          currentPartIndex = state.activeIdx || blockCount || 1;

          if (blockCount > 0) {
            renderPartTabs();
            showActiveBlock(currentPartIndex);
            document.getElementById('actionArea').style.display = state.hasAction ? 'flex' : 'none';
            document.getElementById('nextStoryArea').style.display = state.hasNextStory ? 'block' : 'none';
            return;
          }
        } catch (e) {}
      }

      blockCount = 0;
      currentPartIndex = 1;
      blockDataMap = {};
      renderPartTabs();
      document.getElementById('activeBlockCard').style.display = 'none';
      document.getElementById('actionArea').style.display = 'none';
      document.getElementById('nextStoryArea').style.display = 'none';
    }

    function renderCharacters() {
      const area = document.getElementById('charactersListArea');
      area.innerHTML = '';
      charactersList.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'char-card';
        div.innerHTML = `
          <div class="char-header">
            <span style="font-weight:800; font-size:0.85rem; color:#34d399;">#${idx + 1}</span>
            <button style="background:none; border:none; color:#f87171; cursor:pointer;" onclick="deleteCharacter(${idx})">🗑️ 削除</button>
          </div>
          <div class="char-row">
            <div>
              <div class="field-label">名前</div>

          </div>
          <div style="margin-bottom:8px;">

    function updateCharField(idx, field, val) {
      charactersList[idx][field] = val;
      localStorage.setItem('buta_chars_json', JSON.stringify(charactersList));
    }

    function addNewCharacter() {
      charactersList.unshift({ name: "新しいキャラクター", role: "味方 / 敵", attr: "特徴", detail: "設定を入力してください。" });
      localStorage.setItem('buta_chars_json', JSON.stringify(charactersList));
      renderCharacters();

      if (confirm(`「${charactersList[idx].name}」を削除しますか？`)) {
        charactersList.splice(idx, 1);
        localStorage.setItem('buta_chars_json', JSON.stringify(charactersList));
        renderCharacters();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getAllContext() {
      let charsText = "【登場人物名鑑】\n";
      charactersList.forEach(c => {
        charsText += `・${c.name}（${c.role}）: 特徴【${c.attr}】 詳細: ${c.detail}\n`;
      });
      const world = document.getElementById('worldInput').value;
      return `${charsText}\n\n【世界観・設定】\n${world}`;
    }

    function getFullStoryRoadmap() {
      let roadmap = `【作品全体の全${partsList.length}部ロードマップ（全体構造）】\n`;
      partsList.forEach(p => {
        roadmap += `◆ ${p.title}\n${p.story}\n\n`;
      });
      return roadmap;
    }

    function switchTab(tabId, tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('currentTabName').innerText = tabName;
      const navMap = { write: 0, story: 1, characters: 2, world: 3, consult: 4 };
      document.querySelectorAll('.nav-item')[navMap[tabId]].classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function limitTo3000Chars(str) {
      if (!str) return "";
      if (str.length <= 2800) return str;
      let cutIndex = str.lastIndexOf("。", 2800);
      if (cutIndex === -1 || cutIndex < 2000) cutIndex = 2800;
      return str.substring(0, cutIndex + 1);
    }

    function cleanGeminiOutput(text) {
      if (!text) return "";
      return text.replace(/\\n/g, "\n")
                 .replace(/\\"/g, '"')
                 .replace(/",\s*"type"\s*:\s*"text"[\s\S]*/, "")
                 .replace(/"type"\s*:\s*"text"[\s\S]*/, "")
                 .replace(/\{\s*"totalTokenCount"[\s\S]*/, "")
                 .replace(/\{\s*"usageMetadata"[\s\S]*/, "")
                 .replace(/```markdown/gi, "")
                 .replace(/```/g, "")
                 .trim();
    }

    async function callGemini(promptText) {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("APIキーが設定されていません。画面右上の「🔑 API」から入力してください。");

      const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${apiKey}`;
      const payload = {
        model: "gemini-3.5-flash",
        input: promptText,
        generation_config: { max_output_tokens: 8192 }
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const rawText = await res.text();
      const json = JSON.parse(rawText);
      if (json.error) throw new Error("APIエラー: " + json.error.message);

      let text = "";
      try {
        if (json.steps && json.steps.length > 0) {
          for (let step of json.steps) {
            if (step.content && step.content.parts) {
              for (let part of step.content.parts) if (part.text) text += part.text;
            } else if (step.output) {
              if (typeof step.output === 'string') text += step.output;
              else if (step.output.content && step.output.content.parts) {
                for (let part of step.output.content.parts) if (part.text) text += part.text;
              }
            }
          }
        }
      } catch (e) {}

      if (!text && json.outputs && json.outputs.length > 0) text = json.outputs[0].text || "";
      if (!text) {
        const match = rawText.match(/"text"\s*:\s*"([\s\S]*?)"\s*\}(?=\s*,\s*"type"|\s*\]|\s*$)/);
        text = match ? match[1] : "";
      }
      if (!text) throw new Error("本文を取得できませんでした。");

      return cleanGeminiOutput(text);
    }

    function setLoading(isLoading, text) {
      document.getElementById('startBtn').disabled = isLoading;
      const consultBtn = document.getElementById('consultBtn');
      if (consultBtn) consultBtn.disabled = isLoading;
      const nextBtn = document.getElementById('nextBtn');
      const finishBtn = document.getElementById('finishBtn');
      if (nextBtn) nextBtn.disabled = isLoading;
      if (finishBtn) finishBtn.disabled = isLoading;
      
      const loadEl = document.getElementById('loading');
      if (text) loadEl.innerText = text;
      loadEl.style.display = isLoading ? 'block' : 'none';
    }

    async function askConsultation() {
      const query = document.getElementById('consultQuery').value;
      if (!query.trim()) {
        alert('相談内容を入力してください。');
        return;
      }
      setLoading(true, "💡 編集者が助言を考案中...");
      
      const currentPart = partsList.find(p => p.partNum === currentPartNum);

      const prompt = `あなたはライトノベル『豚面執事』の専属敏腕編集者です。
作者からの相談に答えてください。

【作品設定】
${getAllContext()}

${getFullStoryRoadmap()}

【現在進行中の部：${currentPart.title}】
${currentPart.story}

【作者からの相談】
${query}

【回答指示】
1. 編集者としてのアドバイス（豚面のギャップやユーモア、先の部への伏線やネタバレ防止を考慮すること）
2. 【具体的な展開・セリフ案】`;

      try {
        const text = await callGemini(prompt);
        setLoading(false);
        const area = document.getElementById('consultResultArea');
        area.style.display = 'block';
        area.innerText = text;
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    function renderPartTabs() {
      const bar = document.getElementById('partTabsBar');
      if (blockCount <= 0) {
        bar.style.display = 'none';
        document.getElementById('activeBlockCard').style.display = 'none';
        return;
      }

      bar.innerHTML = '';
      bar.style.display = 'flex';
      for (let i = 1; i <= blockCount; i++) {
        const btn = document.createElement('button');
        btn.className = `part-tab-btn ${i === currentPartIndex ? 'active' : ''}`;
        btn.innerText = `パート ${i}`;
        btn.onclick = () => showActiveBlock(i);
        bar.appendChild(btn);
      }
    }

    function showActiveBlock(idx) {
      currentPartIndex = idx;
      renderPartTabs();

      const card = document.getElementById('activeBlockCard');
      card.style.display = 'block';

      const text = blockDataMap[idx] || "";
      document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${idx} （${text.length}文字）`;
      document.getElementById('activeBlockText').innerText = text;
      document.getElementById('allCopyBtn').innerText = `📑 第${currentPartNum}部の全パートを一括コピー`;

      if (currentPartIndex < blockCount) {
        document.getElementById('nextBtn').innerText = `⚡ パート ${currentPartIndex} の続きとして再分岐する`;
      } else {
        document.getElementById('nextBtn').innerText = `⚡ パート ${blockCount + 1} を執筆する`;
      }

      savePartWritingState(currentPartNum);
    }

    function onActiveBlockInput() {
      const text = document.getElementById('activeBlockText').innerText;
      blockDataMap[currentPartIndex] = text;
      document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${currentPartIndex} （${text.length}文字）`;
      savePartWritingState(currentPartNum);
    }

    function copyCurrentBlock() {
      const text = blockDataMap[currentPartIndex] || "";
      navigator.clipboard.writeText(text).then(() => {
        alert(`第${currentPartNum}部 パート ${currentPartIndex} をコピーしました！`);
      });
    }

    function copyAllBlocks() {
      let allText = "";
      for (let i = 1; i <= blockCount; i++) {
        allText += `【第${currentPartNum}部 パート ${i}】\n\n${blockDataMap[i] || ""}\n\n`;
      }
      navigator.clipboard.writeText(allText.trim()).then(() => {
        alert(`第${currentPartNum}部 全${blockCount}パート（計 ${allText.length} 文字）を一括コピーしました！`);
      });
    }

    async function startGeneration() {
      const part = partsList.find(p => p.partNum === currentPartNum);

      if (blockCount > 0 && !confirm(`第${currentPartNum}部のパート1を新設定で書き直します。\n※パート2以降はリセットされます。よろしいですか？`)) {
        return;
      }

      blockCount = 0;
      currentPartIndex = 1;
      blockDataMap = {};
      renderPartTabs();
      document.getElementById('actionArea').style.display = 'none';
      document.getElementById('nextStoryArea').style.display = 'none';
      savePartWritingState(currentPartNum);

      setLoading(true, `✍️ 【${part.title}】新パート1を執筆中...`);

      const prompt = `あなたはプロのライトノベル作家です。
以下の作品設定と全体のストーリー構造を把握した上で、『豚面執事』の【第${currentPartNum}部 パート1】を執筆してください。

【作品設定】
${getAllContext()}

${getFullStoryRoadmap()}

【今回執筆するストーリー：${part.title}】
${part.story}

【ネタバレ防止と情報開示の鉄則（最重要ガード）】
1. あなたは全${partsList.length}部の結末・全真相を知っていますが、**【第${currentPartNum}部】より先の部で明かされる秘密・悪事の真相・素顔の件などを地の文やセリフで絶対に先出しネタバレしてはなりません**。
2. 後の部で明かされる出来事（例：両親の死の真相、素顔の秘密など）は、現時点ではあくまで「微かな違和感」「さりげない伏線」として匂わせる程度に留めてください。
3. 読者および登場人物の視点に合わせて、現在進行中の【第${currentPartNum}部】のコメディとドラマに集中して描写してください。

【執筆ルール】
・この部の「冒頭・導入シーン」から執筆を開始してください。
・設定を長々と説明せず、キャラクターの優雅な所作、冷徹な強さ、豚面のギャップ（被り物なのに表情が動くシュールさ）、会話のテンポで見せること（Show, don't tell）。
・大場蓮（レン）の完璧な執事ぶりと丁寧な言葉遣い、エリーとカイルの驚きと安堵を生き生きと描いてください。
・文章量は【2,000〜2,800文字程度】で執筆してください。
・小説本文のみを出力してください。`;

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        setLoading(false);

        blockCount = 1;
        currentPartIndex = 1;
        blockDataMap[1] = limited;

        renderPartTabs();
        showActiveBlock(1);
        document.getElementById('actionArea').style.display = 'flex';
        savePartWritingState(currentPartNum);
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    async function generateNext(isFinal) {
      const part = partsList.find(p => p.partNum === currentPartNum);

      if (currentPartIndex < blockCount) {
        if (!confirm(`現在「パート ${currentPartIndex}」を表示中です。\nこのパートの直後から新しい展開として書き直しますか？`)) {
          return;
        }
        for (let i = currentPartIndex + 1; i <= blockCount; i++) {
          delete blockDataMap[i];
        }
        blockCount = currentPartIndex;
      }

      const lastText = blockDataMap[blockCount] || "";
      const safeLastText = lastText.length > 1500 ? lastText.substring(lastText.length - 1500) : lastText;
      const targetPartIndex = blockCount + 1;

      setLoading(true, isFinal ? `🏁 【${part.title}】完結パートを執筆中...` : `✍️ パート ${targetPartIndex} を執筆中...`);

      let endingInstruction = "直前の文章から直接つなげて、ストーリー展開の次のシーンへと物語を進めてください。";
      if (isFinal) {
        endingInstruction = `直前の文章からつなげて、この部のクライマックス・決着を描ききり、綺麗に完結させてください。`;
      }

      const prompt = `あなたはプロのライトノベル作家です。『豚面執事』第${currentPartNum}部の続き（パート ${targetPartIndex}）を執筆してください。

【作品設定】
${getAllContext()}

${getFullStoryRoadmap()}

【今回執筆している部：${part.title}】
${part.story}

【直前の本文（この直後から繋げてください）】
${safeLastText}

【ネタバレ防止と情報開示の鉄則（最重要ガード）】
1. あなたは全${partsList.length}部の全貌を知っていますが、**【第${currentPartNum}部】より先の部で明かされる秘密・陰謀・真相を地の文やセリフで絶対に先出しネタバレしてはなりません**。
2. 後の部で明かされる真実は、現時点ではあくまで「微かな伏線」として匂わせる程度に留めてください。
3. 現在進行中の【第${currentPartNum}部】の展開とテンポに集中して描写してください。

【執筆指示】
・${endingInstruction}
・設定説明に終始せず、キャラクターの生々しい行動と会話を主体に描写すること。
・文章量は【2,000〜2,800文字程度】で執筆してください。
・小説本文のみを出力してください。`;

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        setLoading(false);

        blockCount++;
        currentPartIndex = blockCount;
        blockDataMap[blockCount] = limited;

        renderPartTabs();
        showActiveBlock(blockCount);

        if (isFinal) {
          document.getElementById('actionArea').style.display = 'none';
          document.getElementById('nextStoryArea').style.display = 'block';
        }
        savePartWritingState(currentPartNum);
      } catch (err) {
        setLoading(false);
        alert(err.message);
      }
    }

    async function retryActiveBlock() {
      const part = partsList.find(p => p.partNum === currentPartNum);
      let prevText = currentPartIndex > 1 ? (blockDataMap[currentPartIndex - 1] || "") : "";
      const safeLastText = prevText.length > 1500 ? prevText.substring(prevText.length - 1500) : prevText;

      document.getElementById('retryBtn').disabled = true;
      document.getElementById('activeBlockText').innerText = "🔄 AIが再執筆中...";

      let prompt = `あなたはプロのライトノベル作家です。『豚面執事』【${part.title}】パート ${currentPartIndex} を書き直してください。\n\n【作品設定】\n${getAllContext()}\n\n${getFullStoryRoadmap()}\n\n【現在の展開】\n${part.story}\n\n【最重要ガード】\n第${currentPartNum}部より先の秘密や真相は絶対にネタバレせず、あくまで伏線や匂わせに留めてください。\n\n`;
      if (currentPartIndex === 1) {
        prompt += `冒頭シーンから2,000〜2,800文字で執筆してください。`;
      } else {
        prompt += `【直前本文】\n${safeLastText}\n\n直前の文章から直接繋げて2,000〜2,800文字で執筆してください。`;
      }

      try {
        const text = await callGemini(prompt);
        const limited = limitTo3000Chars(text);
        blockDataMap[currentPartIndex] = limited;
        document.getElementById('activeBlockText').innerText = limited;
        document.getElementById('activeBlockTitle').innerText = `第${currentPartNum}部 パート ${currentPartIndex} （${limited.length}文字）`;
        document.getElementById('retryBtn').disabled = false;
        savePartWritingState(currentPartNum);
      } catch (err) {
        document.getElementById('retryBtn').disabled = false;
        alert(err.message);
      }
    }

    function goToNextPart() {
      savePartWritingState(currentPartNum);
      const nextNum = currentPartNum + 1;
      if (nextNum <= partsList.length) {
        document.getElementById('partSelect').value = nextNum;
        onPartSelectChange();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        alert(`第${currentPartNum}部の本文を保存し、第${nextNum}部の準備が完了しました！`);
      } else {
        alert('全構成が完結しました！お疲れ様でした！');
      }
    }
  </script>
</body>
</html>
